<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password badlein</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <nav id="appNav"></nav>

  <main class="container py-4" style="max-width: 480px;">
    <h1 class="h3 mb-1">Password badlein</h1>
    <p class="text-muted mb-4">Kam az kam 8 harf. Password badalne ke baad bhi aap login rehte hain.</p>

    <form id="pwForm" class="card" novalidate>
      <div class="card-body">
        <div class="mb-3">
          <label for="currentPassword" class="form-label">Purana password</label>
          <input id="currentPassword" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <div class="mb-3">
          <label for="newPassword" class="form-label">Naya password</label>
          <input id="newPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="mb-1">
          <label for="confirmPassword" class="form-label">Naya password dobara</label>
          <input id="confirmPassword" type="password" class="form-control" autocomplete="new-password" required>
        </div>
      </div>
      <div class="card-footer bg-white d-flex justify-content-end">
        <button id="pwBtn" type="submit" class="btn btn-primary">Password badlein</button>
      </div>
    </form>
  </main>

  <script src="/lib/jquery/dist/jquery.min.js"></script>
  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    $(function () {
      App.init('change-password', 'Password badlein').then(function () {
        $('#pwForm').on('submit', function (e) {
          e.preventDefault();
          var current = $('#currentPassword').val();
          var next = $('#newPassword').val();
          if (!current || !next) { App.notify('Dono password likhein.', 'warning'); return; }
          if (next.length < 8) { App.notify('Naya password kam az kam 8 harf ka ho.', 'warning'); return; }
          if (next !== $('#confirmPassword').val()) { App.notify('Naya password dono jagah ek jaisa likhein.', 'warning'); return; }

          var $btn = $('#pwBtn').prop('disabled', true).text('Ruk jayein...');
          Api.post('/api/auth/change-password', { currentPassword: current, newPassword: next })
            .then(function () {
              $('#pwForm')[0].reset();
              App.notify('Password badal gaya.');
            })
            .catch(function (xhr) { App.notify(Api.errorMessage(xhr), 'danger'); })
            .finally(function () { $btn.prop('disabled', false).text('Password badlein'); });
        });
      });
    });
  </script>
</body>
</html>
